name: Keep Supabase awake

# Supabase's free plan pauses a project that has had no activity for a week. This calls a trivial
# database function through the API twice a week, so there's always recent activity. Run it by hand
# from the Actions tab to check it works. The URL and publishable key are read from src/supabase.js,
# so there's nothing to configure (the publishable key is public by design).

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Call heartbeat()
        run: |
          url=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' src/supabase.js | head -1)
          key=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' src/supabase.js | head -1)
          test -n "$url" && test -n "$key" || { echo "Couldn't read the Supabase URL and key from src/supabase.js"; exit 1; }
          # -f makes a non-2xx answer fail the job, so a broken ping shows up as a red run
          response=$(curl -fsS --retry 3 --retry-delay 10 -X POST "$url/rest/v1/rpc/heartbeat" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered: $response"
