.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--radius);padding:.6rem 1.1rem;min-height:44px;cursor:pointer;font-weight:500;white-space:nowrap}

<body>

<script>
/* ---------- Storage ---------- */
const KEY = 'tally:v1';
const THEME_KEY = 'tally:theme';
function getThemeOverride(){ try{ return localStorage.getItem(THEME_KEY); }catch(e){ return null; } }
function systemPrefersDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function isDarkActive(){ const t = getThemeOverride(); return t ? t === 'dark' : systemPrefersDark(); }
function renderThemeToggle(){
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  const dark = isDarkActive();
  btn.textContent = dark ? '☀' : '☾';

  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
}
function applyTheme(){
  const t = getThemeOverride();
  if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  renderThemeToggle();
}
applyTheme();
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = isDarkActive() ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme();
});
try{
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if(!getThemeOverride()) renderThemeToggle(); };
  mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
}catch(e){}
function normalize(s){
  if(!s || typeof s !== 'object') s = {};
  if(!Array.isArray(s.people)) s.people = [];
  if(!Array.isArray(s.groups)) s.groups = [];
  if(!Array.isArray(s.payments)) s.payments = [];
  if(!('meId' in s)) s.meId = null;
  s.groups.forEach(g => {
    if(!Array.isArray(g.members)) { g.members = []; return; }
    if(g.members.length && typeof g.members[0] === 'object'){
      g.members.forEach(m => { if(m && m.id && !s.people.some(p => p.id === m.id)) s.people.push({ id:m.id, name:m.name || 'Someone' }); });
      g.members = g.members.map(m => m.id);
    }
  });
  if(!('activeGroupId' in s)) s.activeGroupId = s.groups[0]?.id || null;
  s.version = 2;

}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s) return normalize(s); }
  }catch(e){}
  return normalize({});
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ return false; } }
let state = load();
let view = 'groups'; /* 'groups' | 'people' */
function storageWorks(){
  try{ const k = '__tally_test__'; localStorage.setItem(k,'1'); const ok = localStorage.getItem(k) === '1'; localStorage.removeItem(k); return ok; }
  catch(e){ return false; }
}
const canPersist = storageWorks();
function renderBanner(){
  const el = $('#banner');
  el.innerHTML = canPersist ? '' : `<div class="banner"><b>Nothing here is being saved</b>This page can't write to storage in its current view, so your data will disappear when you leave. If you opened this from inside the Claude app, tap the share icon and choose "Open in Safari" (or open the link directly in Safari), then reload.</div>`;
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const CURRENCIES = ['GBP','EUR','USD','CHF','SEK','NOK','DKK','AUD','CAD','NZD'];
function group(){
  let g = state.groups.find(x => x.id === state.activeGroupId);
  if(!g && state.groups.length){ g = state.groups[0]; state.activeGroupId = g.id; }
  return g || null;
}
function person(id){ return state.people.find(p => p.id === id) || { id, name:'Someone' }; }
const personName = id => person(id).name;
function groupsOf(pid){ return state.groups.filter(g => g.members.includes(pid)); }
function personLocked(pid){ return state.groups.some(g => g.members.includes(pid)) || state.payments.some(p => p.from===pid || p.to===pid); }
function money(p, cur){
  try{ return new Intl.NumberFormat('en-GB',{style:'currency',currency:cur}).format(p/100); }
  catch(e){ return (p/100).toFixed(2) + ' ' + cur; }
}
function toPence(v){
  const s = String(v ?? '').replace(/[^0-9.\-]/g,'');
  if(s === '' ) return 0;
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n*100) : NaN;
}

/* Split an integer total (pence) by weights, largest-remainder so pennies always add up */
function distribute(total, weights){
  const ids = Object.keys(weights).filter(id => weights[id] > 0);
  const W = ids.reduce((s,id) => s + weights[id], 0);
  if(!W) return null;
  const rows = ids.map(id => { const exact = total*weights[id]/W; const base = Math.floor(exact); return {id, base, rem: exact-base}; });
  let left = total - rows.reduce((s,r) => s + r.base, 0);
  rows.sort((a,b) => b.rem - a.rem);
  for(let k=0; k<left; k++) rows[k % rows.length].base++;
  const out = {}; rows.forEach(r => out[r.id] = r.base); return out;
}
function balances(g){
  const b = {}; g.members.forEach(id => b[id] = 0);
  g.expenses.forEach(e => {
    if(e.paidBy in b) b[e.paidBy] += e.amount;
    for(const [id,v] of Object.entries(e.splits)) if(id in b) b[id] -= v;
  });
  return b;
}
/* Fewest-transfers settle-up: greedy match largest debtor to largest creditor */
function settlements(b){
  const cr = [], db = [];
  for(const [id,v] of Object.entries(b)){ if(v>0) cr.push({id,v}); else if(v<0) db.push({id,v:-v}); }
  cr.sort((a,c) => c.v-a.v); db.sort((a,c) => c.v-a.v);
  const out = []; let i=0, j=0;
  while(i<db.length && j<cr.length){
    const x = Math.min(db[i].v, cr[j].v);
    out.push({from:db[i].id, to:cr[j].id, amount:x});
    db[i].v -= x; cr[j].v -= x;
    if(!db[i].v) i++; if(!cr[j].v) j++;

  return out;
}
function involved(g, mid){ return g.expenses.some(e => e.paidBy === mid || mid in e.splits); }
/* Every group balance plus every standalone settlement, grouped by currency */
function personCurrencyTotals(pid){
  const totals = {};
  state.groups.forEach(g => {
    if(!g.members.includes(pid)) return;
    const b = balances(g)[pid] || 0;
    totals[g.currency] = (totals[g.currency] || 0) + b;
  });
  state.payments.forEach(p => {
    if(p.from === pid) totals[p.currency] = (totals[p.currency] || 0) + p.amount;
    if(p.to === pid) totals[p.currency] = (totals[p.currency] || 0) - p.amount;
  });

}

/* ---------- Render ---------- */
function render(){

}
function renderNav(){

  const peopleBtn = $('#peopleBtn');

  if(state.groups.length && view==='groups'){
    parts.push(`<label class="sr" style="position:absolute;left:-9999px" for="gpick">Group</label>
      <select id="gpick" aria-label="Choose group">${state.groups.map(x => `<option value="${x.id}" ${g&&x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>

}
function renderGroupView(){
  const app = $('#app'), g = group();
  if(!g){
    app.innerHTML = `
      <section class="empty">
        <h1>You're not part of any groups</h1>

  app.innerHTML = `
    <section class="hero">
      <h1>${esc(g.name)}</h1>

            <span class="lname" title="${esc(name)}">${esc(name)}</span>

            </div>
            <span class="lamt ${cls}">${label}</span>
          </div>`;
        }).join('')}
      </div>
    </section>

    <div class="actions">
      <button class="btn primary" data-action="add-expense" ${g.members.length?'':'disabled'}>Add expense</button>

    <section class="block">

    <section class="block">
      <h2>Activity</h2>

    </section>`;
}
function renderPeopleView(){
  const app = $('#app');
  const people = state.people.slice().sort((a,b) => a.name.localeCompare(b.name));
  const activity = state.payments.slice().sort((a,c) => (c.date||'').localeCompare(a.date||'') || c.createdAt - a.createdAt);
  app.innerHTML = `
    <section class="hero">
      <h1>People</h1>
    </section>

    <div class="actions">
      <button class="btn primary" data-action="add-person">Add a person</button>

    <section class="block">

        const bal = totals.length

          : `<span class="lamt zero">Square</span>`;
        const gnames = groupsOf(p.id).map(g => esc(g.name)).join(', ');
        return `<li><button class="item person" data-action="edit-person" data-id="${p.id}">
          <span class="pname"><span>${esc(p.name)}${p.id===state.meId?' <span class="imeta" style="display:inline">· You</span>':''}</span><span class="imeta">${gnames || 'Not in a group yet'}</span></span>
          ${bal}</button></li>`;
      }).join('')}</ul>` : `<p class="none">No one saved yet. Add a person to get started.</p>`}
    </section>

    <section class="block">
      <h2>Settlements outside a group</h2>
      ${activity.length ? `<ul class="list">${activity.map(p => {
        const d = p.date ? new Date(p.date+'T12:00:00') : new Date(p.createdAt);
        const day = d.getDate(), mon = d.toLocaleDateString('en-GB',{month:'short'});
        return `<li><button class="item payment" data-action="edit-settlement" data-id="${p.id}">

          <span class="iamt">${money(p.amount,p.currency)}</span></button></li>`;
      }).join('')}</ul>` : `<p class="none">Record a payment here when two people settle up outside any group's expenses.</p>`}
    </section>`;
}

/* ---------- Expense ---------- */
function openExpense(eid, prefill){
  const g = group(); const e = eid ? g.expenses.find(x => x.id === eid) : null;
  const def = { equal:{}, exact:{}, shares:{} };
  g.members.forEach(mid => { def.equal[mid] = 1; def.shares[mid] = 1; def.exact[mid] = ''; });
  draft = { id: e?.id, mode: e?.splitMode || prefill?.mode || 'equal', ...def };
  if(e){
    const inp = e.splitInput || {};
    g.members.forEach(mid => {
      if(e.splitMode==='equal') draft.equal[mid] = inp[mid] ? 1 : 0;
      if(e.splitMode==='shares') draft.shares[mid] = inp[mid] ?? 0;
      if(e.splitMode==='exact') draft.exact[mid] = inp[mid] ? (inp[mid]/100).toFixed(2) : '';
    });
  }
  if(prefill?.subset) g.members.forEach(mid => draft.equal[mid] = prefill.subset.includes(mid) ? 1 : 0);
  const descVal = prefill?.desc ?? e?.desc ?? '';
  const amountVal = prefill?.amount != null ? (prefill.amount/100).toFixed(2) : (e ? (e.amount/100).toFixed(2) : '');
  const dateVal = prefill?.date || e?.date || today();
  const paidByVal = prefill?.paidBy || e?.paidBy || (state.meId && g.members.includes(state.meId) ? state.meId : g.members[0]);
  const modes = [['equal','Equally'],['exact','Exact amounts'],['shares','Shares']];
  openDialog(`
    <h2>${e?'Edit expense':'Add expense'}</h2>
    <label>What was it for?<input name="desc" maxlength="80" value="${esc(descVal)}" placeholder="e.g. Dinner at Hawksmoor"></label>
    <div class="two">
      <label>Amount (${g.currency})<input name="amount" inputmode="decimal" autocomplete="off" value="${amountVal}" placeholder="0.00"></label>
      <label>Date<input type="date" name="date" value="${dateVal}"></label>
    </div>
    <label>Paid by<select name="paidBy">${g.members.map(mid => `<option value="${mid}" ${mid===paidByVal?'selected':''}>${esc(personName(mid))}</option>`).join('')}</select></label>
    <fieldset><legend>Split</legend><div class="seg">${modes.map(([v,l]) => `<label><input type="radio" name="mode" value="${v}" ${draft.mode===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset>
    <div class="srows" id="splitRows"></div>
    <p class="hint" id="splitHint"></p>
    <p class="err" role="alert"></p>
    <div class="dlg-actions">
      ${e?`<button type="button" class="btn danger" data-action="del-entry" data-id="${e.id}">Delete</button>`:''}
      <span class="sp"></span>
      <button type="button" class="btn" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">${e?'Save changes':'Add expense'}</button>
    </div>`, saveExpense);
  renderSplitRows();
}
function renderSplitRows(){
  const g = group(), m = draft.mode;
  $('#splitRows').innerHTML = g.members.map(mid => {
    const name = esc(personName(mid));
    if(m==='equal') return `<label class="srow"><input type="checkbox" data-sid="${mid}" ${draft.equal[mid]?'checked':''}><span class="nm">${name}</span><span class="sval" data-share="${mid}"></span></label>`;
    if(m==='exact') return `<label class="srow"><span class="nm">${name}</span><input inputmode="decimal" autocomplete="off" aria-label="${name}'s amount" data-sid="${mid}" value="${esc(draft.exact[mid])}" placeholder="0.00"></label>`;
    return `<label class="srow"><span class="nm">${name}</span><span class="sval" data-share="${mid}"></span><input type="number" min="0" step="1" inputmode="numeric" aria-label="${name}'s shares" data-sid="${mid}" value="${draft.shares[mid]}"></label>`;
  }).join('');
  updateHint();
}
function updateHint(){
  const g = group(), amount = toPence(form.amount.value), hint = $('#splitHint');
  hint.className = 'hint';
  form.querySelectorAll('[data-share]').forEach(s => s.textContent = '');
  if(draft.mode === 'exact'){
    let sum = 0; for(const v of Object.values(draft.exact)) sum += toPence(v) || 0;
    const left = (amount||0) - sum;
    if(!amount){ hint.textContent = `Assigned so far: ${money(sum,g.currency)}`; }
    else if(left === 0){ hint.textContent = 'Everything is assigned.'; }
    else { hint.textContent = left>0 ? `${money(left,g.currency)} left to assign` : `${money(-left,g.currency)} more than the total`; hint.classList.add('bad'); }
    return;
  }
  const w = {}; g.members.forEach(mid => w[mid] = draft.mode==='equal' ? (draft.equal[mid]?1:0) : Math.max(0, Number(draft.shares[mid])||0));
  const split = amount>0 ? distribute(amount, w) : null;
  if(split) for(const [id,v] of Object.entries(split)){ const el = form.querySelector(`[data-share="${id}"]`); if(el) el.textContent = money(v,g.currency); }
  const n = Object.values(w).filter(x => x>0).length;
  hint.textContent = n ? '' : (draft.mode==='equal' ? 'Pick at least one person.' : 'Give at least one person a share.');
  if(!n) hint.classList.add('bad');
}
form.addEventListener('change', ev => {
  if(!draft) return;
  const t = ev.target;
  if(t.name === 'mode'){ draft.mode = t.value; renderSplitRows(); return; }
  if(t.dataset.sid && t.type === 'checkbox'){ draft.equal[t.dataset.sid] = t.checked ? 1 : 0; updateHint(); }
});
form.addEventListener('input', ev => {
  if(!draft) return;
  const t = ev.target;
  if(t.dataset.sid && t.type !== 'checkbox'){
    const id = t.dataset.sid;
    if(draft.mode==='exact') draft.exact[id] = t.value; else draft.shares[id] = t.value;
  }
  if((t.dataset.sid && t.type !== 'checkbox') || t.name === 'amount') updateHint();
});
function saveExpense(){
  const g = group();
  const desc = form.desc.value.trim();
  const amount = toPence(form.amount.value);
  if(!desc) return fail('Add a short description, like "Dinner".');
  if(!(amount > 0)) return fail('Enter an amount above zero.');
  let splits, input = {};
  if(draft.mode === 'exact'){
    splits = {}; let sum = 0;
    for(const mid of g.members){
      const p = toPence(draft.exact[mid]);
      if(Number.isNaN(p) || p < 0) return fail(`Check the amount for ${personName(mid)}.`);
      if(p > 0){ splits[mid] = p; input[mid] = p; sum += p; }
    }
    if(sum !== amount) return fail(`The split adds up to ${money(sum,g.currency)}, but the expense is ${money(amount,g.currency)}.`);
  } else {
    g.members.forEach(mid => input[mid] = draft.mode==='equal' ? (draft.equal[mid]?1:0) : Math.max(0, Math.floor(Number(draft.shares[mid])||0)));
    splits = distribute(amount, input);
    if(!splits) return fail(draft.mode==='equal' ? 'Pick at least one person to split with.' : 'Give at least one person a share above zero.');
  }
  const rec = { type:'expense', desc, amount, paidBy: form.paidBy.value, splits, splitMode: draft.mode, splitInput: input, date: form.date.value || today() };
  if(draft.id){ const e = g.expenses.find(x => x.id === draft.id); Object.assign(e, rec); }
  else g.expenses.push({ id: uid(), createdAt: Date.now(), ...rec });
}

/* ---------- Voice expense ---------- */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null;
function openVoiceExpense(){
  const g = group(); if(!g) return;
  if(!SpeechRecognitionCtor){
    openDialog(`
      <h2>Voice isn't available here</h2>
      <p class="hint">This browser doesn't support voice input. Try Chrome, Edge or Safari, or add the expense the usual way.</p>
      <div class="dlg-actions"><span class="sp"></span><button type="button" class="btn primary" data-action="close">OK</button></div>`, () => false);
    return;
  }
  draft = null;
  let finalText = '';
  const rec = new SpeechRecognitionCtor();
  activeRecognition = rec;
  rec.lang = navigator.language || 'en-GB';
  rec.interimResults = true;
  rec.continuous = false;
  openDialog(`
    <h2><span class="mic-dot" aria-hidden="true"></span>Listening…</h2>
    <p class="hint">Try "dinner at Nando's yesterday split equally".</p>
    <p id="voiceText" class="hint voice-text" aria-live="polite"></p>
    <p class="err" role="alert"></p>
    <div class="dlg-actions"><span class="sp"></span><button type="button" class="btn" data-action="close">Cancel</button></div>`, () => false);
  const textEl = $('#voiceText');
  rec.onresult = ev => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    if(textEl) textEl.textContent = (finalText + interim).trim() || 'Listening…';
  };
  rec.onerror = ev => {
    const err = form.querySelector('.err');
    if(err) err.textContent = ev.error === 'not-allowed'
      ? 'Microphone access was blocked. If you opened this from inside the Claude app, tap the share icon and choose "Open in Safari" — mic permission has to be granted there, not inside another app.'
      : "Didn't catch that — try again.";
  };
  rec.onend = () => {
    activeRecognition = null;
    if(!dlg.open) return;
    const text = finalText.trim();
    if(!text){ const err = form.querySelector('.err'); if(err) err.textContent = "Didn't catch that — try again, or add the expense the usual way."; return; }
    openExpense(null, parseVoiceExpense(text, g));
  };
  try{ rec.start(); }catch(err){ const e = form.querySelector('.err'); if(e) e.textContent = "Couldn't start the microphone."; }
}
/* Lightweight, local heuristics — no server round-trip. Every field it fills stays editable before saving. */
function parseVoiceExpense(text, g){
  let t = ' ' + text.trim() + ' ';
  const result = {};

  /* amount: prefer an explicit currency mark, then a currency word, then any bare number */
  let m = t.match(/[£$€]\s?(\d+(?:[.,]\d{1,2})?)/)
    || t.match(/(\d+(?:[.,]\d{1,2})?)\s?(pounds?|quid|dollars?|bucks|euros?)\b/i)
    || t.match(/\b(\d+(?:[.,]\d{1,2})?)\b/);
  if(m){ result.amount = toPence(m[1].replace(',','.')); t = t.replace(m[0], ' '); }

  /* date: yesterday / today / a weekday name */
  const fmt = d => { const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  let dm;
  if(/\byesterday\b/i.test(t)){ const d = new Date(); d.setDate(d.getDate()-1); result.date = fmt(d); t = t.replace(/\byesterday\b/i,' '); }
  else if(/\btoday\b|\btonight\b|\bthis evening\b/i.test(t)){ result.date = fmt(new Date()); t = t.replace(/\btoday\b|\btonight\b|\bthis evening\b/i,' '); }
  else if((dm = t.match(new RegExp('\\b(last\\s+)?(' + days.join('|') + ')\\b','i')))){
    const idx = days.indexOf(dm[2].toLowerCase()), d = new Date();
    let diff = (d.getDay() - idx + 7) % 7; if(diff === 0 && dm[1]) diff = 7;
    d.setDate(d.getDate() - diff); result.date = fmt(d); t = t.replace(dm[0], ' ');
  }

  /* who paid: "<name> paid" */
  g.members.forEach(mid => {
    const re = new RegExp('\\b' + personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s+paid\\b','i');
    if(re.test(t)){ result.paidBy = mid; t = t.replace(re, ' '); }
  });

  /* split: "split equally", or naming a subset ("between Sam and Alex", "just me and Sam") */
  if(/\bsplit(ting)?\s+(it\s+)?(equally|evenly|even)\b/i.test(t) || /\bequal(ly)?\s+split\b/i.test(t)){
    result.mode = 'equal';
    t = t.replace(/\bsplit(ting)?\s+(it\s+)?(equally|evenly|even)\b/i,' ').replace(/\bequal(ly)?\s+split\b/i,' ');
  }
  const named = g.members.filter(mid => new RegExp('\\b' + personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','i').test(t));
  if(/\bbetween\b|\bjust\b|\bonly\b/i.test(t) && named.length >= 2){
    result.mode = 'equal'; result.subset = named;
    const names = named.map(mid => personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
    t = t.replace(new RegExp('\\b(between|just|only)\\b(\\s+me\\b)?(\\s*(,|and|&)?\\s*(' + names + '))+','ig'), ' ');
  }

  /* whatever's left becomes the description */
  let desc = t.replace(/\s+/g,' ').trim()
    .replace(/^(for|the|a|an)\s+/i,'')
    .replace(/^[,\s]+|[,\s]+$/g,'')
    .replace(/\s+(on|at|for|with|and)$/i,'')
    .replace(/[.,;:!?]+$/,'');
  result.desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : text.trim();
  return result;
}

function renderMembers(){
  const box = $('#mlist');

    const checked = draft.members.includes(p.id);
    const locked = checked && editingGroup && editingGroup.members.includes(p.id) && involved(editingGroup, p.id);
    return `<label class="srow"><input type="checkbox" data-pid="${p.id}" ${checked?'checked':''} ${locked?'disabled':''}><span class="nm">${esc(p.name)}</span>${locked?'<span class="sval">in an expense</span>':''}</label>`;
  }).join('') : `<p class="hint" style="margin:0">Nobody's here yet.</p>`;
}
function addPendingMember(){
  const inp = form.newMember; if(!inp) return;
  const n = inp.value.trim(); if(!n) return;
  let p = state.people.find(x => x.name.toLowerCase() === n.toLowerCase());
  if(!p){ p = { id: uid(), name: n }; state.people.push(p); }
  if(!draft.members.includes(p.id)) draft.members.push(p.id);
  inp.value = ''; renderMembers(); inp.focus();
}
form.addEventListener('keydown', ev => { if(ev.target.name === 'newMember' && ev.key === 'Enter'){ ev.preventDefault(); addPendingMember(); } });
form.addEventListener('change', ev => {
  const t = ev.target;
  if(t.dataset.pid && draft){
    if(t.checked){ if(!draft.members.includes(t.dataset.pid)) draft.members.push(t.dataset.pid); }
    else draft.members = draft.members.filter(id => id !== t.dataset.pid);
  }
});

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if(!b || b.disabled) return;
  const g = group(), a = b.dataset.action;
  if(a==='new-group') openGroup(true);
  else if(a==='edit-group') openGroup(false);
  else if(a==='add-expense') openExpense();
  else if(a==='voice-expense') openVoiceExpense();
  else if(a==='edit-expense') openExpense(b.dataset.id);
  else if(a==='add-payment') openPayment();
  else if(a==='edit-payment') openPayment({id:b.dataset.id});
  else if(a==='settle') openPayment({from:b.dataset.from, to:b.dataset.to, amount:+b.dataset.amount});
  else if(a==='view-people'){ view = 'people'; render(); }
  else if(a==='view-groups'){ view = 'groups'; render(); }
  else if(a==='add-person') openPerson();
  else if(a==='edit-person') openPerson(b.dataset.id);
  else if(a==='del-person'){ if(!personLocked(b.dataset.id) && confirm('Delete this person?')){ state.people = state.people.filter(x => x.id !== b.dataset.id); closeDialog(); save(); render(); } }
  else if(a==='add-settlement') openSettlement();
  else if(a==='edit-settlement') openSettlement({id:b.dataset.id});
  else if(a==='del-settlement'){ if(confirm('Delete this settlement?')){ state.payments = state.payments.filter(x => x.id !== b.dataset.id); closeDialog(); save(); render(); } }
  else if(a==='close') closeDialog();
  else if(a==='add-member') addPendingMember();
  else if(a==='del-entry'){ if(confirm('Delete this entry?')){ g.expenses = g.expenses.filter(x => x.id !== b.dataset.id); closeDialog(); save(); render(); } }
  else if(a==='del-group'){ if(confirm(`Delete "${g.name}" and all its expenses? The people in it stay saved.`)){ state.groups = state.groups.filter(x => x.id !== g.id); state.activeGroupId = state.groups[0]?.id || null; closeDialog(); save(); render(); } }
});
document.addEventListener('change', ev => { if(ev.target.id === 'gpick'){ state.activeGroupId = ev.target.value; view = 'groups'; save(); render(); } });
dlg.addEventListener('close', () => { onSubmit = null; draft = null; if(activeRecognition){ activeRecognition.abort(); activeRecognition = null; } });

render();
</script>
</body>
</html>
