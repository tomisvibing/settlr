  });
  state.payments.forEach(p => {
    if(p.from === pid) totals[p.currency] = (totals[p.currency] || 0) + p.amount;
    if(p.to === pid) totals[p.currency] = (totals[p.currency] || 0) - p.amount;
  });
  return totals;
}

/* ---------- Routing (hash-based so the back button and home-screen app both work) ---------- */
function parseRoute(){
  const h = location.hash;
  if(!h.startsWith('#/')) return { name:'home' };
  const [name, arg] = h.slice(2).split('/');
  if(name === 'g' && arg) return { name:'group', id: decodeURIComponent(arg) };
  if(name === 'people' || name === 'settings') return { name };
  if(name === 'join' && arg) return { name:'join', code: decodeURIComponent(arg) };
  return { name:'home' };
}
function navigate(hash){ if(location.hash === hash) render(); else location.hash = hash; }
const groupHref = g => '#/g/' + encodeURIComponent(g.id);
const inviteLink = g => location.origin + location.pathname + '#/join/' + encodeURIComponent(g.inviteCode);

/* ---------- Render ---------- */
function render(){
  let r = parseRoute();
  if(r.name === 'join'){
    history.replaceState(null, '', location.pathname + location.search + '#/');
    renderRoute({ name:'home' });
    openJoinGroup(r.code);
    return;
  }
  renderRoute(r);
}
function renderRoute(r){
  const tab = r.name === 'group' ? 'home' : r.name;
  [['home','#navHome'],['people','#navPeople'],['settings','#navSettings']].forEach(([n,sel]) => {
    const el = $(sel); if(n === tab) el.setAttribute('aria-current','page'); else el.removeAttribute('aria-current');
  });
  if(r.name === 'group') renderGroupView(r.id);
  else if(r.name === 'people') renderPeopleView();
  else if(r.name === 'settings') renderSettings();
  else renderHome();
}
const spentIn = g => g.expenses.filter(e => e.type !== 'payment').reduce((s,e) => s+e.amount, 0);
const initial = s => ([...String(s||'').trim()][0] || '?').toUpperCase();
/* What an entry did to my balance: + means I'm owed more, − means I owe more */
function myLine(e, g){
  const me = meIn(g); if(!me) return '';
  const v = (e.paidBy === me ? e.amount : 0) - (e.splits[me] || 0);
  if(!v) return '';
  const isPay = e.type === 'payment';
  const word = v > 0 ? (isPay ? 'you paid' : 'you lent') : (isPay ? 'you received' : 'you borrowed');
  return `<small class="${v>0?'pos':'neg'}">${word} ${money(Math.abs(v), g.currency)}</small>`;
}
function entryMeta(e){
  const n = Object.keys(e.splits).length;
  if(e.type === 'payment') return `${esc(personName(e.paidBy))} paid ${esc(personName(Object.keys(e.splits)[0]))}`;
  return `${esc(personName(e.paidBy))} paid, ${e.splitMode==='exact'?'split by amount':e.splitMode==='shares'?'split by shares':`split ${n} ${n===1?'way':'ways'}`}`;
}
function entryInner(e, g, groupName){
  const { day, mon } = dayMonth(e), isPay = e.type === 'payment';
  return `<span class="idate"><b>${day}</b>${mon}</span>
    <span><span class="idesc">${esc(isPay?'Payment':e.desc)}</span><span class="imeta">${groupName ? esc(g.name) + ' · ' : ''}${entryMeta(e)}</span></span>
    <span class="iamt">${money(e.amount,g.currency)}${myLine(e,g)}</span>`;
}
function myTotals(){
  const totals = {};
  state.myIds.forEach(pid => { for(const [c,v] of Object.entries(personCurrencyTotals(pid))) totals[c] = (totals[c]||0) + v; });
  return Object.entries(totals).filter(([,v]) => v !== 0);
}

/* ---------- Dialog plumbing ---------- */
const dlg = $('#dlg'), form = $('#dlgForm');
let onSubmit = null, draft = null;
function openDialog(html, submit){
  form.innerHTML = html; onSubmit = submit;
  if(!dlg.open) dlg.showModal();
  const first = form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]):not([type=date]),textarea');
  if(first) first.focus();
}
function closeDialog(){ if(dlg.open) dlg.close(); onSubmit = null; draft = null; }
function fail(msg){ const e = form.querySelector('.err'); if(e) e.textContent = msg; return false; }
async function refresh(){
  try{ await loadAllData(); }
  catch(err){ toast(`Couldn't refresh: ${err.message || 'check your connection'}`); }
  render();
}
function describeError(err){
  return [err?.message, err?.details, err?.hint].filter(Boolean).join(' — ') || 'Could not save. Try again.';
}
form.addEventListener('submit', async ev => {
  ev.preventDefault();
  if(!onSubmit) return;
  const submitBtn = form.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    const result = await onSubmit();
    /* a handler returns false to keep the dialog open, or a route to go to once saved */
    if(result !== false){ closeDialog(); await refresh(); if(typeof result === 'string') navigate(result); }
  } finally {
    if(submitBtn) submitBtn.disabled = false;
  }
});

/* ---------- Expense ---------- */
function openExpense(eid, prefill){
  const g = group(); const e = eid ? g.expenses.find(x => x.id === eid) : null;
  const def = { equal:{}, exact:{}, shares:{} };
  g.members.forEach(mid => { def.equal[mid] = 1; def.shares[mid] = 1; def.exact[mid] = ''; });
  draft = { id: e?.id, mode: e?.splitMode || prefill?.mode || 'equal', ...def };
  if(e){
    const inp = e.splitInput || {};
    g.members.forEach(mid => {
      if(e.splitMode==='equal') draft.equal[mid] = inp[mid] ? 1 : 0;
      if(e.splitMode==='shares') draft.shares[mid] = inp[mid] ?? 0;
      if(e.splitMode==='exact') draft.exact[mid] = inp[mid] ? (inp[mid]/100).toFixed(2) : '';
    });
  }
  if(prefill?.subset) g.members.forEach(mid => draft.equal[mid] = prefill.subset.includes(mid) ? 1 : 0);
  const descVal = prefill?.desc ?? e?.desc ?? '';
  const amountVal = prefill?.amount != null ? (prefill.amount/100).toFixed(2) : (e ? (e.amount/100).toFixed(2) : '');
  const dateVal = prefill?.date || e?.date || today();
  const paidByVal = prefill?.paidBy || e?.paidBy || defaultPayer(g);
  const modes = [['equal','Equally'],['exact','Exact amounts'],['shares','Shares']];
  openDialog(`
    <h2>${e?'Edit expense':'Add expense'}</h2>
    <label>What was it for?<input name="desc" maxlength="80" value="${esc(descVal)}" placeholder="e.g. Dinner at Hawksmoor"></label>
    <div class="two">
      <label>Amount (${g.currency})<input name="amount" inputmode="decimal" autocomplete="off" value="${amountVal}" placeholder="0.00"></label>
      <label>Date<input type="date" name="date" value="${dateVal}"></label>
    </div>
    <label>Paid by<select name="paidBy">${g.members.map(mid => `<option value="${mid}" ${mid===paidByVal?'selected':''}>${esc(personName(mid))}</option>`).join('')}</select></label>
    <fieldset><legend>Split</legend><div class="seg">${modes.map(([v,l]) => `<label><input type="radio" name="mode" value="${v}" ${draft.mode===v?'checked':''}><span>${l}</span></label>`).join('')}</div></fieldset>
    <div class="srows" id="splitRows"></div>
    <p class="hint" id="splitHint"></p>
    <p class="err" role="alert"></p>
    <div class="dlg-actions">
      ${e?`<button type="button" class="btn danger" data-action="del-entry" data-id="${e.id}">Delete</button>`:''}
      <span class="sp"></span>
      <button type="button" class="btn" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">${e?'Save changes':'Add expense'}</button>
    </div>`, saveExpense);
  renderSplitRows();
}
function renderSplitRows(){
  const g = group(), m = draft.mode;
  $('#splitRows').innerHTML = g.members.map(mid => {
    const name = esc(personName(mid));
    if(m==='equal') return `<label class="srow"><input type="checkbox" data-sid="${mid}" ${draft.equal[mid]?'checked':''}><span class="nm">${name}</span><span class="sval" data-share="${mid}"></span></label>`;
    if(m==='exact') return `<label class="srow"><span class="nm">${name}</span><input inputmode="decimal" autocomplete="off" aria-label="${name}'s amount" data-sid="${mid}" value="${esc(draft.exact[mid])}" placeholder="0.00"></label>`;
    return `<label class="srow"><span class="nm">${name}</span><span class="sval" data-share="${mid}"></span><input type="number" min="0" step="1" inputmode="numeric" aria-label="${name}'s shares" data-sid="${mid}" value="${draft.shares[mid]}"></label>`;
  }).join('');
  updateHint();
}
function updateHint(){
  const g = group(), amount = toPence(form.amount.value), hint = $('#splitHint');
  hint.className = 'hint';
  form.querySelectorAll('[data-share]').forEach(s => s.textContent = '');
  if(draft.mode === 'exact'){
    let sum = 0; for(const v of Object.values(draft.exact)) sum += toPence(v) || 0;
    const left = (amount||0) - sum;
    if(!amount){ hint.textContent = `Assigned so far: ${money(sum,g.currency)}`; }
    else if(left === 0){ hint.textContent = 'Everything is assigned.'; }
    else { hint.textContent = left>0 ? `${money(left,g.currency)} left to assign` : `${money(-left,g.currency)} more than the total`; hint.classList.add('bad'); }
    return;
  }
  const w = {}; g.members.forEach(mid => w[mid] = draft.mode==='equal' ? (draft.equal[mid]?1:0) : Math.max(0, Number(draft.shares[mid])||0));
  const split = amount>0 ? distribute(amount, w) : null;
  if(split) for(const [id,v] of Object.entries(split)){ const el = form.querySelector(`[data-share="${id}"]`); if(el) el.textContent = money(v,g.currency); }
  const n = Object.values(w).filter(x => x>0).length;
  hint.textContent = n ? '' : (draft.mode==='equal' ? 'Pick at least one person.' : 'Give at least one person a share.');
  if(!n) hint.classList.add('bad');
}
form.addEventListener('change', ev => {
  if(!draft) return;
  const t = ev.target;
  if(t.name === 'mode'){ draft.mode = t.value; renderSplitRows(); return; }
  if(t.dataset.sid && t.type === 'checkbox'){ draft.equal[t.dataset.sid] = t.checked ? 1 : 0; updateHint(); }
});
form.addEventListener('input', ev => {
  if(!draft) return;
  const t = ev.target;
  if(t.dataset.sid && t.type !== 'checkbox'){
    const id = t.dataset.sid;
    if(draft.mode==='exact') draft.exact[id] = t.value; else draft.shares[id] = t.value;
  }
  if((t.dataset.sid && t.type !== 'checkbox') || t.name === 'amount') updateHint();
});
async function saveExpense(){
  const g = group();
  const desc = form.desc.value.trim();
  const amount = toPence(form.amount.value);
  if(!desc) return fail('Add a short description, like "Dinner".');
  if(!(amount > 0)) return fail('Enter an amount above zero.');
  let splits, input = {};
  if(draft.mode === 'exact'){
    splits = {}; let sum = 0;
    for(const mid of g.members){
      const p = toPence(draft.exact[mid]);
      if(Number.isNaN(p) || p < 0) return fail(`Check the amount for ${personName(mid)}.`);
      if(p > 0){ splits[mid] = p; input[mid] = p; sum += p; }
    }
    if(sum !== amount) return fail(`The split adds up to ${money(sum,g.currency)}, but the expense is ${money(amount,g.currency)}.`);
  } else {
    g.members.forEach(mid => input[mid] = draft.mode==='equal' ? (draft.equal[mid]?1:0) : Math.max(0, Math.floor(Number(draft.shares[mid])||0)));
    splits = distribute(amount, input);
    if(!splits) return fail(draft.mode==='equal' ? 'Pick at least one person to split with.' : 'Give at least one person a share above zero.');
  }
  const row = { group_id: g.id, type:'expense', description: desc, amount_cents: amount, paid_by: form.paidBy.value, split_mode: draft.mode, expense_date: form.date.value || today(), split_input: input };
  return saveExpenseRow(draft.id, row, splits);
}
async function saveExpenseRow(expenseId, row, splits){

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRecognition = null;
function openVoiceExpense(){
  const g = group(); if(!g) return;
  if(!SpeechRecognitionCtor){
    openDialog(`
      <h2>Voice isn't available here</h2>
      <p class="hint">This browser doesn't support voice input. Try Chrome, Edge or Safari, or add the expense the usual way.</p>
      <div class="dlg-actions"><span class="sp"></span><button type="button" class="btn primary" data-action="close">OK</button></div>`, () => false);
    return;
  }
  draft = null;
  let finalText = '';
  const rec = new SpeechRecognitionCtor();
  activeRecognition = rec;
  rec.lang = navigator.language || 'en-GB';
  rec.interimResults = true;
  rec.continuous = false;
  openDialog(`
    <h2><span class="mic-dot" aria-hidden="true"></span>Listening…</h2>
    <p class="hint">Try "dinner at Nando's yesterday split equally".</p>
    <p id="voiceText" class="hint voice-text" aria-live="polite"></p>
    <p class="err" role="alert"></p>
    <div class="dlg-actions"><span class="sp"></span><button type="button" class="btn" data-action="close">Cancel</button></div>`, () => false);
  const textEl = $('#voiceText');
  rec.onresult = ev => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    if(textEl) textEl.textContent = (finalText + interim).trim() || 'Listening…';
  };
  rec.onerror = ev => {
    const err = form.querySelector('.err');
    if(err) err.textContent = ev.error === 'not-allowed'
      ? 'Microphone access was blocked. If you opened this from inside the Claude app, tap the share icon and choose "Open in Safari" — mic permission has to be granted there, not inside another app.'
      : "Didn't catch that — try again.";
  };
  rec.onend = () => {
    activeRecognition = null;
    if(!dlg.open) return;
    const text = finalText.trim();
    if(!text){ const err = form.querySelector('.err'); if(err) err.textContent = "Didn't catch that — try again, or add the expense the usual way."; return; }
    openExpense(null, parseVoiceExpense(text, g));
  };
  try{ rec.start(); }catch(err){ const e = form.querySelector('.err'); if(e) e.textContent = "Couldn't start the microphone."; }
}
/* Lightweight, local heuristics — no server round-trip. Every field it fills stays editable before saving. */
function parseVoiceExpense(text, g){
  let t = ' ' + text.trim() + ' ';
  const result = {};

  /* amount: prefer an explicit currency mark, then a currency word, then any bare number */
  let m = t.match(/[£$€]\s?(\d+(?:[.,]\d{1,2})?)/)
    || t.match(/(\d+(?:[.,]\d{1,2})?)\s?(pounds?|quid|dollars?|bucks|euros?)\b/i)
    || t.match(/\b(\d+(?:[.,]\d{1,2})?)\b/);
  if(m){ result.amount = toPence(m[1].replace(',','.')); t = t.replace(m[0], ' '); }

  /* date: yesterday / today / a weekday name */
  const fmt = d => { const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  let dm;
  if(/\byesterday\b/i.test(t)){ const d = new Date(); d.setDate(d.getDate()-1); result.date = fmt(d); t = t.replace(/\byesterday\b/i,' '); }
  else if(/\btoday\b|\btonight\b|\bthis evening\b/i.test(t)){ result.date = fmt(new Date()); t = t.replace(/\btoday\b|\btonight\b|\bthis evening\b/i,' '); }
  else if((dm = t.match(new RegExp('\\b(last\\s+)?(' + days.join('|') + ')\\b','i')))){
    const idx = days.indexOf(dm[2].toLowerCase()), d = new Date();
    let diff = (d.getDay() - idx + 7) % 7; if(diff === 0 && dm[1]) diff = 7;
    d.setDate(d.getDate() - diff); result.date = fmt(d); t = t.replace(dm[0], ' ');
  }

  /* who paid: "<name> paid" */
  g.members.forEach(mid => {
    const re = new RegExp('\\b' + personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s+paid\\b','i');
    if(re.test(t)){ result.paidBy = mid; t = t.replace(re, ' '); }
  });

  /* split: "split equally", or naming a subset ("between Sam and Alex", "just me and Sam") */
  if(/\bsplit(ting)?\s+(it\s+)?(equally|evenly|even)\b/i.test(t) || /\bequal(ly)?\s+split\b/i.test(t)){
    result.mode = 'equal';
    t = t.replace(/\bsplit(ting)?\s+(it\s+)?(equally|evenly|even)\b/i,' ').replace(/\bequal(ly)?\s+split\b/i,' ');
  }
  const named = g.members.filter(mid => new RegExp('\\b' + personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','i').test(t));
  if(/\bbetween\b|\bjust\b|\bonly\b/i.test(t) && named.length >= 2){
    result.mode = 'equal'; result.subset = named;
    const names = named.map(mid => personName(mid).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
    t = t.replace(new RegExp('\\b(between|just|only)\\b(\\s+me\\b)?(\\s*(,|and|&)?\\s*(' + names + '))+','ig'), ' ');
  }

  /* whatever's left becomes the description */
  let desc = t.replace(/\s+/g,' ').trim()
    .replace(/^(for|the|a|an)\s+/i,'')
    .replace(/^[,\s]+|[,\s]+$/g,'')
    .replace(/\s+(on|at|for|with|and)$/i,'')
    .replace(/[.,;:!?]+$/,'');
  result.desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : text.trim();
  return result;
}

function openGroup(isNew){

  openDialog(`
    <h2>${isNew?'New group':'Edit group'}</h2>

    <p class="err" role="alert"></p>

      ${g?`<button type="button" class="btn danger" data-action="del-group">Delete group</button>`:''}
      <span class="sp"></span>
      <button type="button" class="btn" data-action="close">Cancel</button>
      <button type="submit" class="btn primary">${isNew?'Create group':'Save changes'}</button>
    </div>`, async () => {
      await addPendingMember();
      const name = form.name.value.trim();
      if(!name) return fail('Give the group a name.');
      if(draft.members.length < 2) return fail('Add at least two people.');
      const chosen = draft.members.map(id => personName(id).toLowerCase());
      if(new Set(chosen).size !== chosen.length) return fail('Two of the people you picked share a name. Rename one so the ledger stays clear.');
      try{
        if(g){
          const { error } = await sb.from('groups').update({ name, currency: form.currency.value }).eq('id', g.id);
          if(error) throw error;
          const before = new Set(g.members), after = new Set(draft.members);
          const toAdd = draft.members.filter(id => !before.has(id));
          const toRemove = g.members.filter(id => !after.has(id));
          if(toAdd.length){ const { error:ae } = await sb.from('group_members').insert(toAdd.map(person_id => ({ group_id: g.id, person_id }))); if(ae) throw ae; }
          for(const pid of toRemove){ const { error:re } = await sb.from('group_members').delete().eq('group_id', g.id).eq('person_id', pid); if(re) throw re; }
        } else {
          const { data: gid, error } = await sb.rpc('create_group', { name, currency: form.currency.value, member_person_ids: draft.members });
          if(error) throw error;
          return '#/g/' + encodeURIComponent(gid);
        }
      }catch(err){ return fail(describeError(err)); }
    });
  renderMembers();
}
function renderMembers(){
  const box = $('#mlist');
  const list = state.people.slice().sort((a,b) => a.name.localeCompare(b.name));
  const editingGroup = draft.editingGroupId ? state.groups.find(x => x.id === draft.editingGroupId) : null;
  box.innerHTML = list.length ? list.map(p => {
    const checked = draft.members.includes(p.id);
    const locked = checked && editingGroup && editingGroup.members.includes(p.id) && involved(editingGroup, p.id);
    return `<label class="srow"><input type="checkbox" data-pid="${p.id}" ${checked?'checked':''} ${locked?'disabled':''}><span class="nm">${esc(p.name)}</span>${locked?'<span class="sval">in an expense</span>':''}</label>`;
  }).join('') : `<p class="hint" style="margin:0">Nobody's here yet.</p>`;
}
async function addPendingMember(){
  const inp = form.newMember; if(!inp) return;
  const n = inp.value.trim(); if(!n) return;
  let p = state.people.find(x => x.name.toLowerCase() === n.toLowerCase());
  if(!p){
    const { data, error } = await sb.from('people').insert({ name: n, owner_id: session.user.id }).select('id,name').single();
    if(error){ const el = form.querySelector('.err'); if(el) el.textContent = error.message; return; }
    p = { id: data.id, name: data.name };
    state.people.push(p);
  }
  if(!draft.members.includes(p.id)) draft.members.push(p.id);
  inp.value = ''; renderMembers(); inp.focus();
}

    e.date || '', e.type === 'payment' ? 'Payment' : e.desc, e.type === 'payment' ? 'Payment' : 'Expense',
    (e.amount/100).toFixed(2), g.currency, personName(e.paidBy),
    ...g.members.map(mid => e.splits[mid] ? (e.splits[mid]/100).toFixed(2) : '')
  ]));
  download(`${slug(g.name)}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function exportAll(){
  const cents = v => (v/100).toFixed(2);
  const data = {
    exportedAt: new Date().toISOString(),
    account: { name: personName(myPersonId), email: session.user.email || null },
    groups: state.groups.map(g => ({
      name: g.name, currency: g.currency, inviteCode: g.inviteCode, members: g.members.map(personName),
      entries: [...g.expenses].sort(byNewest).map(e => ({
        date: e.date, type: e.type, description: e.type === 'payment' ? 'Payment' : e.desc, amount: cents(e.amount),
        paidBy: personName(e.paidBy), splitMode: e.splitMode,
        splits: Object.fromEntries(Object.entries(e.splits).map(([id,v]) => [personName(id), cents(v)]))
      }))
    })),
    people: state.people.map(p => p.name).sort(),
    settlements: state.payments.slice().sort(byNewest).map(p => ({ date: p.date, from: personName(p.from), to: personName(p.to), amount: cents(p.amount), currency: p.currency, note: p.note || null })),
  };
  download(`settlr-export-${today()}.json`, JSON.stringify(data, null, 2), 'application/json');
}

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-action]'); if(!b || b.disabled) return;
  const g = group(), a = b.dataset.action;
  if(a==='new-group') openGroup(true);
  else if(a==='edit-group') openGroup(false);
  else if(a==='join-group') openJoinGroup();
  else if(a==='add-expense') openExpense();
  else if(a==='voice-expense') openVoiceExpense();
  else if(a==='edit-expense') openExpense(b.dataset.id);
  else if(a==='add-payment') openPayment();
  else if(a==='edit-payment') openPayment({id:b.dataset.id});
  else if(a==='settle') openPayment({from:b.dataset.from, to:b.dataset.to, amount:+b.dataset.amount});
  else if(a==='add-person') openPerson();
  else if(a==='edit-person') openPerson(b.dataset.id);
  else if(a==='del-person'){
    if(!personLocked(b.dataset.id) && confirm('Delete this person?')){
      const { error } = await sb.from('people').delete().eq('id', b.dataset.id);
      if(error){ fail(describeError(error)); return; }
      closeDialog(); await refresh();
    }
  }
  else if(a==='add-settlement') openSettlement();
  else if(a==='edit-settlement') openSettlement({id:b.dataset.id});
  else if(a==='del-settlement'){
    if(confirm('Delete this settlement?')){
      const { error } = await sb.from('payments').delete().eq('id', b.dataset.id);
      if(error){ fail(describeError(error)); return; }
      closeDialog(); await refresh();
    }
  }
  else if(a==='close') closeDialog();
  else if(a==='add-member') await addPendingMember();
  else if(a==='invite'){ if(g) await shareInvite(g); }
  else if(a==='export-group'){ if(g) exportGroupCsv(g); }
  else if(a==='export-all') exportAll();
  else if(a==='edit-profile') openProfile();
  else if(a==='delete-account') openDeleteAccount();
  else if(a==='sign-out') await signOut();
  else if(a==='retry') location.reload();
  else if(a==='del-entry'){
    if(confirm('Delete this entry?')){
      const { error } = await sb.from('expenses').delete().eq('id', b.dataset.id);
      if(error){ fail(describeError(error)); return; }
      closeDialog(); await refresh();
    }
  }
  else if(a==='del-group'){
    if(confirm(`Delete "${g.name}" and all its expenses for everyone in it? The people in it stay saved.`)){
      const { error } = await sb.from('groups').delete().eq('id', g.id);
      if(error){ fail(describeError(error)); return; }
      state.activeGroupId = null;
      closeDialog(); navigate('#/'); await refresh();
      toast(`Deleted ${g.name}.`);
    }
  }
});
document.addEventListener('change', ev => {
  if(ev.target.name === 'theme' && !ev.target.closest('dialog')) setTheme(ev.target.value);
});
document.addEventListener('input', ev => {
  if(ev.target.dataset.filter === 'activity') filterActivity(ev.target.value);
});
dlg.addEventListener('close', () => { onSubmit = null; draft = null; if(activeRecognition){ activeRecognition.abort(); activeRecognition = null; } });
window.addEventListener('hashchange', () => {
  if(!session){ rememberPendingJoin(); return; }
  if(!myPersonId) return;
  closeDialog(); render(); window.scrollTo(0, 0);
});
/* Other people edit shared groups too — pick up their changes when the app comes back into view */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && myPersonId && !dlg.open && Date.now() - lastLoadedAt > 30000) refresh();
});

/* ---------- Auth & data loading ---------- */
async function ensureMyPerson(){
  const uid = session.user.id;
  const name = session.user.user_metadata?.full_name || session.user.email || 'Me';
  /* ignoreDuplicates: create my contact once (race-safe) without overwriting a name I've since changed */
  const { error } = await sb.from('people').upsert({ owner_id: uid, user_id: uid, name }, { onConflict: 'owner_id,user_id', ignoreDuplicates: true });
  if(error) throw error;
  const { data, error: se } = await sb.from('people').select('id').eq('owner_id', uid).eq('user_id', uid).single();
  if(se) throw se;
  myPersonId = data.id;
}
async function loadAllData(){
  const results = await Promise.all([
    sb.from('groups').select('*').order('created_at'),
    sb.from('people').select('*').order('name'),
    sb.from('group_members').select('*'),
    sb.from('expenses').select('*').order('expense_date', { ascending:false }),
    sb.from('expense_splits').select('*'),
    sb.from('payments').select('*').order('payment_date', { ascending:false }),
  ]);
  const failed = results.find(r => r.error);
  if(failed) throw failed.error;
  const [groups, people, members, expenses, splits, payments] = results.map(r => r.data || []);

  state.people = people.map(p => ({ id:p.id, name:p.name, userId:p.user_id }));
  state.myIds = new Set(state.people.filter(p => p.userId === session.user.id).map(p => p.id));
  if(myPersonId) state.myIds.add(myPersonId);

  const splitsByExpense = {};
  splits.forEach(s => { (splitsByExpense[s.expense_id] ||= {})[s.person_id] = s.amount_cents; });

  const expensesByGroup = {};
  expenses.forEach(e => {
    (expensesByGroup[e.group_id] ||= []).push({
      id: e.id, type: e.type, desc: e.description, amount: e.amount_cents,
      paidBy: e.paid_by, splits: splitsByExpense[e.id] || {}, splitMode: e.split_mode,
      splitInput: e.split_input || {}, date: e.expense_date, createdAt: new Date(e.created_at).getTime()
    });
  });

  const membersByGroup = {};
  members.forEach(m => { (membersByGroup[m.group_id] ||= []).push(m.person_id); });

  state.groups = groups.map(g => ({
    id: g.id, name: g.name, currency: g.currency, inviteCode: g.invite_code, createdAt: new Date(g.created_at).getTime(),
    members: membersByGroup[g.id] || [], expenses: expensesByGroup[g.id] || []
  }));

  state.payments = payments.map(p => ({
    id:p.id, from:p.from_person, to:p.to_person, amount:p.amount_cents, currency:p.currency,
    note:p.note, date:p.payment_date, createdAt:new Date(p.created_at).getTime()
  }));
  lastLoadedAt = Date.now();
}
/* An invite link opened while signed out survives the Google round-trip in localStorage */
let authNote = '';
function rememberPendingJoin(){
  const r = parseRoute();
  if(r.name !== 'join') return;
  try{ localStorage.setItem(PENDING_JOIN_KEY, r.code); }catch(e){}
  authNote = authNote || "You've been invited to a group. Sign in to join it.";
  $('#authNote').textContent = authNote;
}
async function onAuthChange(){
  $('#bootScreen').style.display = 'none';
  if(session){
    $('#authGate').style.display = 'none';
    try{
      await ensureMyPerson();
      await loadAllData();
    }catch(err){
      $('#appWrap').style.display = '';
      $('#app').innerHTML = `<section class="empty"><h1>Couldn't load your data: ${esc(err.message||'unknown error')}</h1><button class="btn primary" data-action="retry">Try again</button></section>`;
      return;
    }
    let pending = null;
    try{ pending = localStorage.getItem(PENDING_JOIN_KEY); localStorage.removeItem(PENDING_JOIN_KEY); }catch(e){}
    if(pending && parseRoute().name !== 'join') history.replaceState(null, '', location.pathname + location.search + '#/join/' + encodeURIComponent(pending));
    $('#appWrap').style.display = '';
    render();
  } else {
    myPersonId = null;
    state = emptyState();
    closeDialog();
    rememberPendingJoin();
    $('#authNote').textContent = authNote;
    authNote = '';
    $('#appWrap').style.display = 'none';
    $('#authGate').style.display = '';
  }
}
/* onAuthStateChange fires once immediately with the current session, then again
   on sign-in/out/refresh — serialize handling so overlapping fires can't race
   (e.g. both trying to create the "me" contact at once), and skip token refreshes
   and repeat sign-in events for the same user, which don't need a full reload. */
let authChangeChain = Promise.resolve();
let handledUserId;
sb.auth.onAuthStateChange((event, s) => {
  session = s;
  const uid = s?.user?.id || null;
  if(event !== 'INITIAL_SESSION' && uid === handledUserId) return;
  handledUserId = uid;
  authChangeChain = authChangeChain.then(onAuthChange).catch(err => console.error(err));
});
$('#signInBtn').addEventListener('click', () => {
  sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname + location.search } });
});
</script>
