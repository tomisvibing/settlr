<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>settlr</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="settlr">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080D1F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="bootScreen" class="gate">
  <div class="wordmark">settlr</div>
  <p class="muted" style="margin:0">Loading…</p>
</div>
<div id="authGate" class="gate" style="display:none">
  <div class="wordmark">settlr</div>
  <p class="tagline">Split shared expenses without the maths.</p>
  <p class="hint" id="authNote"></p>
  <div class="signin">
    <button class="btn wide google" id="signInBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.6-.2-2.3H12v4.4h6c-.3 1.4-1.1 2.6-2.2 3.4v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8.3z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9C3.8 20.5 7.6 23 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.3-.4-2s.1-1.4.4-2V7.1H2C1.4 8.6 1 10.2 1 12s.4 3.4 1 4.9L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.3 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.6 1 3.8 3.5 2 7.1L5.7 10c.9-2.7 3.4-4.6 6.3-4.6z"/></svg>Continue with Google</button>
    <div class="or" aria-hidden="true"><span>or</span></div>
    <form id="emailForm" novalidate>
      <label>Email<input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
      <button type="submit" class="btn primary wide">Email me a code</button>
    </form>
    <form id="codeForm" novalidate hidden>
      <p class="sent">We sent a code to <b id="codeEmail"></b>. It can take a minute to arrive.</p>
      <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123456" class="code"></label>
      <button type="submit" class="btn primary wide">Sign in</button>
      <div class="chipbar" style="justify-content:center"><button type="button" class="btn small" id="resendCode">Send a new code</button><button type="button" class="btn small" id="changeEmail">Use a different email</button></div>
    </form>
    <p class="err" id="signinErr" role="alert"></p>
  </div>
</div>
<div id="appWrap" class="shell" style="display:none">
  <button type="button" class="skip-link" data-action="skip">Skip to content</button>
  <nav class="tabbar" aria-label="Main">
    <a class="brand" href="#/">settlr</a>
    <button class="fab" data-action="quick-add" aria-label="Add expense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="fab-label">Add expense</span></button>
    <a class="tab" href="#/overview" id="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Overview</span></a>
    <a class="tab" href="#/people" id="navPeople"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg><span>People</span></a>
    <a class="tab" href="#/activity" id="navActivity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Activity</span></a>
    <a class="tab" href="#/settings" id="navSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/></svg><span>You</span></a>
  </nav>
  <main id="app" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"><form id="dlgForm" novalidate></form></dialog>
<dialog id="confirmDlg" class="confirm" aria-labelledby="confirmTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
